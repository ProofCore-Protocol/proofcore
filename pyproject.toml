[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcore"
version = "0.1.8"
description = "Official Python SDK & AI Tools for ProofCore Blockchain Notarization Protocol."
readme = {file = "README.md", content-type = "text/markdown"}
license = { text = "MIT" }
authors = [{ name = "ProofCore Protocol", email = "sealit@proofcore.org" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
crewai = ["crewai>=0.50.0"]
ui = ["gradio>=4.0.0"]

[project.urls]
Homepage = "https://proofcore.org"
Documentation = "https://proofcore.org/openapi.json"
Repository = "https://github.com/ProofCore-Protocol/proofcore"

[tool.setuptools]
packages = ["proofcore"]